name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'
      - name: Create Android SDK licenses
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $ANDROID_HOME/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a64810" >> $ANDROID_HOME/licenses/android-sdk-license
          echo "2433a38a535b89a803963748386a34731a54a7f3" > $ANDROID_HOME/licenses/android-sdk-arm-dbt-license
          echo "84831b8509b265738ab1d9258863b7301a210ef0" > $ANDROID_HOME/licenses/google-gdk-license
          echo "db887c093415cf99a8427fef66b3d5b06d482596" > $ANDROID_HOME/licenses/android-googletv-license
          echo "504667f4c0de7af1a06de9f4b1727b84351f2910" > $ANDROID_HOME/licenses/android-googlexr-license
      - name: Install dependencies & sync web bundle
        run: |
          npm install --legacy-peer-deps
          npm run build
          npx cap sync android
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          for i in {1..3}; do
            ./gradlew assembleDebug --no-daemon --stacktrace && break || { echo "Build failed (likely rate limit), retrying in 15s ($i/3)..."; sleep 15; }
          done
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ofc-6-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
